name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: Integration tests (local Supabase + stripe-mock)
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase
        run: npx supabase start
      - name: Write .env.local
        run: |
          npx supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' > .env.local
          cat .env.local | cut -d= -f1
      - run: npm run test:db
